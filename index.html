<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neomorphic Scoreboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'base-dark': '#2e3542',
              'panel-dark': 'rgba(46, 53, 66, var(--dynamic-bg-opacity))',
              'light-shadow': 'rgba(255, 255, 255, 0.05)',
              'dark-shadow': 'rgba(0, 0, 0, 0.5)',
            },
            boxShadow: {
              'neo-out': '5px 5px 10px var(--tw-shadow-color), -5px -5px 10px var(--tw-shadow-color-light)',
              'neo-in': 'inset 5px 5px 10px var(--tw-shadow-color), inset -5px -5px 10px var(--tw-shadow-color-light)',
            },
          },
        },
      }
    </script>
    <style>
      :root {
         --dynamic-bg-opacity: 1;
         --tw-shadow-color: rgba(0, 0, 0, 0.5);
         --tw-shadow-color-light: rgba(255, 255, 255, 0.05);
      }
      body {
        background-color: #2e3542;
      }
      .neo-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: #252a36;
        box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.5), inset -1px -1px 2px rgba(255, 255, 255, 0.05);
        outline: none;
        opacity: 0.7;
        transition: opacity .2s;
      }
      .neo-slider:hover {
        opacity: 1;
      }
      .neo-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        background: rgba(46, 53, 66, var(--dynamic-bg-opacity));
        cursor: pointer;
        border-radius: 50%;
        border: 1px solid #475569;
        box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), -2px -2px 4px rgba(255, 255, 255, 0.05);
      }
      .neo-slider::-moz-range-thumb {
        width: 16px;
        height: 16px;
        background: rgba(46, 53, 66, var(--dynamic-bg-opacity));
        cursor: pointer;
        border-radius: 50%;
        border: 1px solid #475569;
        box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), -2px -2px 4px rgba(255, 255, 255, 0.05);
      }
      .hide-on-screenshot {
        display: none !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
